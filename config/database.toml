default = "primary"
auto_migrate = false
migrations_path = "./database/migrations"

[connections.primary]
driver = "mysql"
host = "127.0.0.1"
port = 3306
database = "kolas"
username = "root"
password = ""
read = []
# Per-connection migrations override. When set, this connection uses its own
# migration directory instead of the global `migrations_path` above — useful
# when you run several databases (e.g. Postgres + MySQL) side by side.
# migrations_path = "./database/migrations/primary"

[connections.primary.pool]
max = 10
min = 1
acquire_timeout_ms = 5000
idle_timeout_ms = 600000
max_lifetime_ms = 1800000
