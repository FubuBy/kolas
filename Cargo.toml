[package]
name = "kolas"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
axum = "0.8"
dotenvy = "0.15.7"
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"
tokio = { version = "1.52.2", features = ["full"] }
toml = "1.1.2"

[dev-dependencies]
serde_json = "1.0.149"
tempfile = "3.27.0"

[[test]]
name = "feature"
path = "tests/feature/mod.rs"

[[test]]
name = "unit"
path = "tests/unit/mod.rs"
