[package]
name = "kolas"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
axum = "0.8"
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.52.2", features = ["full"] }

[dev-dependencies]
serde_json = "1.0.149"

[[test]]
name = "feature"
path = "tests/feature/mod.rs"

[[test]]
name = "unit"
path = "tests/unit/mod.rs"
