[package]
name = "kolas"
version = "0.2.1"
edition = "2024"
license = "MIT"

[dependencies]
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
dotenvy = "0.15.7"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_urlencoded = "0.7"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "mysql",
    "sqlite",
    "any",
    "macros",
    "migrate",
    "chrono",
    "uuid",
] }
async-trait = "0.1"
thiserror = "2.0.18"
tokio = { version = "1.52.2", features = ["full"] }
toml = "1.1.2"
tower = { version = "0.5", default-features = false, features = ["util"] }
tower-http = { version = "0.6", features = ["compression-full", "cors", "trace"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
croner = "3.0.1"
chrono-tz = "0.10.4"

[dev-dependencies]
serde_json = "1.0.149"
tempfile = "3.27.0"

[[test]]
name = "feature"
path = "tests/feature/mod.rs"

[[test]]
name = "unit"
path = "tests/unit/mod.rs"
